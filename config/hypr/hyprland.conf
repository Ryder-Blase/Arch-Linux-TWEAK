# ----------------- Monitor -----------------
monitor=eDP-1,preferred,0x0,1.6

# ----------------- Startup -----------------
exec-once = swaybg -i ~/Images/wallpaper.jpg -m fill
exec-once = blueman-applet
exec-once = nm-applet
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6
exec-once = mako

# ----------------- Environment -----------------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

# ----------------- Render / Compositor -----------------
render {
    new_render_scheduling = true
    direct_scanout         = 1
}
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
}

# ----------------- Input -----------------
input {
    kb_layout     = fr
    kb_variant    =
    kb_model      =
    kb_options    =
    kb_rules      =
    repeat_rate   = 50
    repeat_delay  = 300
    follow_mouse = 1

    touchpad {
        natural_scroll        = true
        tap-to-click          = true
        disable_while_typing  = true
        scroll_factor         = 1.0
    }

    sensitivity     = 1
    accel_profile   = adaptive
}

# ----------------- General -----------------
general {
    gaps_in        = 2
    gaps_out       = 10
    border_size    = 1
    col.active_border   = rgba(A65D2Aff)
    col.inactive_border = rgba(586e75ff)
    layout         = dwindle
    allow_tearing  = false
    resize_on_border = true
}

# ----------------- Decoration -----------------
decoration {
    rounding = 0
    blur {
        enabled = false
        size    = 3
        passes  = 1
    }
    shadow {
        enabled = false
    }       
}

# ----------------- Animations -----------------
animations {
    enabled = true
    bezier   = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows,     1, 7, myBezier
    animation = windowsOut,  1, 7, default, popin 80%
    animation = border,      1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade,        1, 7, default
    animation = workspaces,  1, 6, default
}

# ----------------- Layouts -----------------
dwindle {
    pseudotile           = yes
    preserve_split       = yes
    force_split          = 2
    special_scale_factor = 0.8
}

master {
    new_status = master
    new_on_top = 1
    mfact      = 0.5
}

# ----------------- Window rules -----------------
windowrulev2 = tile, class:(.*)
windowrulev2 = tile, title:(.*)
windowrulev2 = float,      class:^(steam_app_.*)$
windowrulev2 = fullscreen,  class:^(steam_app_.*)$
windowrulev2 = float,      class:^(.*\.exe)$
windowrulev2 = fullscreen,  class:^(.*\.exe)$
windowrulev2 = noshadow,   class:^(steam)$

# ----------------- XWayland -----------------
xwayland {
    enabled            = true
    force_zero_scaling = true
}

# ----------------- Keybindings -----------------
$mainMod = SUPER
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, D,      exec, rofi -show drun
bind = $mainMod, E,      exec, pcmanfm
bind = $mainMod, V,      exec, virt‑manager
bind = $mainMod, C,      exec, code
bind = $mainMod, L,      exec, swaylock -c 000000
bind = $mainMod SHIFT, E, exec, wlogout

bind = $mainMod, Q,             killactive,
bind = $mainMod, F,             fullscreen, 0
bind = $mainMod SHIFT, F,        togglefloating,
bind = $mainMod, P,             pseudo,
bind = $mainMod, T,             togglesplit,

bind = $mainMod, S, exec, grim -g "$(slurp)" ~/Images/screenshot-$(date +%Y-%m-%d-%H%M%S).png

bind = $mainMod, LEFT,  movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP,    movefocus, u
bind = $mainMod, DOWN,  movefocus, d
bind = $mainMod, H,     movefocus, l
bind = $mainMod, L,     movefocus, r
bind = $mainMod, K,     movefocus, u
bind = $mainMod, J,     movefocus, d

bind = $mainMod SHIFT, LEFT,  movewindow, l
bind = $mainMod SHIFT, RIGHT, movewindow, r
bind = $mainMod SHIFT, UP,    movewindow, u
bind = $mainMod SHIFT, DOWN,  movewindow, d
bind = $mainMod SHIFT, H,     movewindow, l
bind = $mainMod SHIFT, L,     movewindow, r
bind = $mainMod SHIFT, K,     movewindow, u
bind = $mainMod SHIFT, J,     movewindow, d

bind = $mainMod, R, submap, resize
submap = resize
binde = , RIGHT, resizeactive, 10 0
binde = , LEFT,  resizeactive, -10 0
binde = , UP,    resizeactive, 0 -10
binde = , DOWN,  resizeactive, 0 10
binde = , L,     resizeactive, 10 0
binde = , H,     resizeactive, -10 0
binde = , K,     resizeactive, 0 -10
binde = , J,     resizeactive, 0 10
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
submap = reset

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod CTRL, LEFT,  workspace, -1
bind = $mainMod CTRL, RIGHT, workspace, +1
bind = $mainMod CTRL, UP,    workspace, -3
bind = $mainMod CTRL, DOWN,  workspace, +3

bind = $mainMod CTRL SHIFT, LEFT,  movetoworkspace, -1
bind = $mainMod CTRL SHIFT, RIGHT, movetoworkspace, +1

bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down,  workspace, e+1
bind = $mainMod, mouse_up,    workspace, e-1

# Brightness control
bind = , XF86MonBrightnessUp, exec, brightnessctl -e set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -e set 5%-

# Volume control
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Media control
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous


bind = ALT, TAB,        cyclenext,
bind = ALT, TAB,        bringactivetotop,
bind = ALT SHIFT, TAB,  cyclenext, prev
bind = ALT SHIFT, TAB,  bringactivetotop,

bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, Q, exit,
