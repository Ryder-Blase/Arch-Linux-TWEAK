# ----------------- Monitor -----------------
monitorv2 {
  output = eDP-1
  mode = 2560x1600@165
  position = 0x0
  scale = 1.6666666
 #transform = 2
}

# ----------------- Startup -----------------
#exec-once = mpvpaper -o "no-audio --loop-playlist shuffle" ALL /home/linux/Vidéos/snowfall-in-forest.3840x2160.mp4 -o "fs=yes --no-keepaspect --video-unscaled=no --vf=scale=1920:1200"
exec-once = swaybg -i ~/Images/wallpaper.png -m fill
exec-once=hyprctl setcursor elementary 60
exec-once = blueman-applet
exec-once = nm-applet
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6
exec-once = mako

# ----------------- Environment -----------------
env = XCURSOR_THEME,Breeze
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
# ----------------- Render / Compositor -----------------
render {
    new_render_scheduling = true
    direct_scanout         = 1
}
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
}

cursor {
  no_hardware_cursors = true
}

# ----------------- Input -----------------
input {
    kb_layout     = fr
    kb_variant    =
    kb_model      =
    kb_options    =
    kb_rules      =
    repeat_rate   = 50
    repeat_delay  = 300
    follow_mouse = 1

    touchpad {
        natural_scroll        = true
        tap-to-click          = true
        disable_while_typing  = true
        scroll_factor         = 1.0
    }

    sensitivity     = 1
    accel_profile   = adaptive
}


gestures {
        workspace_swipe_invert = true
        workspace_swipe_distance = 700
        gesture= 3, horizontal, workspace
        gesture = 3, swipe, mod: SUPER, resize
	gesture= 3, down, close 
        gesture = 4, pinch, fullscreen
}

# ----------------- General -----------------
general {
    gaps_in        = 5
    gaps_out       = 20
    border_size    = 1
    col.active_border = rgba(255,255,255,128)
    col.inactive_border = rgba(586e75ff)
    layout         = dwindle
    allow_tearing  = false
    resize_on_border = false
}

# ----------------- Decoration -----------------
decoration {
    rounding = 8

    active_opacity = 0.9
    inactive_opacity = 0.7
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.8

  shadow {
    enabled = true
    range = 30
    render_power = 5
  }


  blur {
    enabled = true
    size = 6
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

