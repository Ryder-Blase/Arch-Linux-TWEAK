dwindle {
    pseudotile           = yes
    preserve_split       = yes
    special_scale_factor = 0.8
}

master {
    new_status = master
    new_on_top = 1
    mfact      = 0.5
}

general {
    resize_on_border = true
    layout           = dwindle

    # Keep tearing off by default – enable per‑window only if you need it
    allow_tearing     = false
}

# ---------- Input ----------
input {
    kb_layout     = fr
    repeat_rate   = 50
    repeat_delay  = 300
    # sensitivity = 0            # Uncomment & tweak if your mouse feels off
}

# ---------- Compositor / GPU ----------
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true

    # Variable‑frame‑rate animations (cheap on AMD)
    vfr = true

    # VRR: 0 = off, 1 = always, 2 = fullscreen‑only (recommended)
    vrr = 0
}

render {
    # Explicit sync avoids stutter on AMD – enable it unconditionally
    #explicit_sync     = 1
    #explicit_sync_kms = 1
    new_render_scheduling = true 
    # Hand the buffer straight to the display engine for single‑fullscreen apps
    direct_scanout    = 1
}

# ---------- Window rules ----------
# Float + fullscreen everything launched by Steam / Lutris so the compositor
# treats it like a proper game window.
windowrulev2 = float,      class:^(steam_app_.*)$
windowrulev2 = fullscreen, class:^(steam_app_.*)$
windowrulev2 = float,      class:^(.*\\.exe)$
windowrulev2 = fullscreen, class:^(.*\\.exe)$

# Steam itself should remain tiled
windowrulev2 = noshadow, class:^(steam)$

# ---------- Xwayland ----------
xwayland {
    enabled            = true
    force_zero_scaling = true   # Prevent blurry fractional‑scaled games
}
