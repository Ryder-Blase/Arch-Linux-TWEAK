[core]
# Essential plugins
plugins = \
  alpha \
  animate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  fast-switcher \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  invert \
  move \
  oswitch \
  place \
  resize \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

# Basic behavior
close_top_view = <super> KEY_A
preferred_decoration_mode = server
xwayland = false

# Workspaces grid (3x3)
vwidth = 3
vheight = 3

# Cursor
cursor_theme = default
cursor_size = 24

[wm-actions]
toggle_fullscreen = <shift> <super> KEY_F
toggle_maximize = <super> KEY_F

[autostart]
# Disable wf-shell if using Waybar
autostart_wf_shell = false

# Startup apps
background = swaybg -i ~/Images/wallpaper.jpg -m fill
panel = waybar
bluetooth = blueman-applet
network = nm-applet
menu_cache = XDG_MENU_PREFIX=arch- kbuildsycoca6

[command]
# App launchers
binding_terminal = <super> KEY_ENTER
command_terminal = foot

binding_launcher = <super> KEY_D
command_launcher = rofi -show drun

binding_file_manager = <super> KEY_E
command_file_manager = pcmanfm

binding_virt_manager = <super> KEY_V
command_virt_manager = virt-manager

binding_code = <super> KEY_C
command_code = code

# Lock/logout
binding_lock = <super> KEY_L
command_lock = swaylock -c 000000
binding_logout = <super> <shift> KEY_E
command_logout = wlogout

# Screenshot
binding_screenshot = <super> KEY_S
command_screenshot = grim -g "$(slurp)" ~/Images/screenshot-$(date +%Y-%m-%d-%H%M%S).png

# Volume
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = pactl set-sink-volume @DEFAULT_SINK@ +5%

repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = pactl set-sink-volume @DEFAULT_SINK@ -5%

binding_mute = KEY_MUTE
command_mute = pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl -e set +5%

repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl -e set 5%-

[decoration]
# Colors and borders
active_color = 0.65 0.36 0.16 1.0
inactive_color = 0.34 0.43 0.46 1.0
border_size = 2
title_height = 0

[expo]
toggle = <super>

[fast-switcher]
activate = <alt> KEY_TAB

[grid]
# Like Sway’s snapping / tiling
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = <super> KEY_UP
slot_b = <super> KEY_DOWN
restore = <super> KEY_KP0

[idle]
screensaver_timeout = 300
dpms_timeout = 600

[input]
# Keyboard
xkb_layout = fr

# Touchpad (similar to Sway)
tap_to_click = true
natural_scroll = true
pointer_accel = 1.0
accel_profile = adaptive
disable_touchpad_while_typing = true
touchpad_cursor_speed = 1.0        # value between -1.0 and +1.0 (higher = faster) :contentReference[oaicite:1]{index=1}
touchpad_accel_profile = adaptive   # you already have this
disable_touchpad_while_mouse = false

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[output:eDP-1]
layout = 0,0
mode = 2560x1600@165.000000
scale = 2.000000
transform = normal

[place]
mode = center

[scale]
toggle = <super> KEY_P
toggle_all = <super> <shift> KEY_P

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[vswitch]
# Workspace switching
binding_left = <super> <ctrl> KEY_LEFT
binding_right = <super> <ctrl> KEY_RIGHT
binding_up = <super> <ctrl> KEY_UP
binding_down = <super> <ctrl> KEY_DOWN

# Workspace number bindings
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9

# Move windows to workspace
with_win_1 = <super> <shift> KEY_1
with_win_2 = <super> <shift> KEY_2
with_win_3 = <super> <shift> KEY_3
with_win_4 = <super> <shift> KEY_4
with_win_5 = <super> <shift> KEY_5
with_win_6 = <super> <shift> KEY_6
with_win_7 = <super> <shift> KEY_7
with_win_8 = <super> <shift> KEY_8
with_win_9 = <super> <shift> KEY_9

[window-rules]
# All windows start maximized (Sway-style tiling)
rule_1 = on created if app_id is ".*" then maximize

[zoom]
modifier = <super> <ctrl>
speed = 0.01
smoothing_duration = 300

[view]
focus_left = <super> KEY_LEFT
focus_down = <super> KEY_DOWN
focus_up = <super> KEY_UP
focus_right = <super> KEY_RIGHT
fullscreen = <super> KEY_F
floating = <super> <shift> KEY_F
